
name: Compilar GameBoost

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Extraer proyecto
        run: |
          unzip -q GameBoost-proyecto.zip -d proyecto
          find proyecto -name build.gradle -print

      - name: Ajustar compatibilidad Android
        run: |
          cd proyecto/GameBoost-proyecto
          sed -i "s/minSdk [0-9]*/minSdk 24/" app/build.gradle
          grep minSdk app/build.gradle

      - name: Compilar APK
        run: |
          cd proyecto/GameBoost-proyecto
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameBoost-APK
          path: proyecto/GameBoost-proyecto/app/build/outputs/apk/debug/*.apk
          
